name: sharsheret-hamesirah
region: fra
services:
- name: sharsheret-hamesirah
  github:
    repo: orelmeister/sharsheret-hamesirah
    branch: main
    deploy_on_push: true
  environment_slug: node-js
  build_command: npm ci && npx prisma generate && npm run build
  run_command: npx prisma migrate deploy && npm run start
  http_port: 3000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    value: postgresql://placeholder:placeholder@localhost:5432/placeholder
  - key: NEXTAUTH_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_URL}
  - key: NEXTAUTH_SECRET
    scope: RUN_TIME
    value: dev-secret-cha…r-later
  - key: ADMIN_USERNAME
    scope: RUN_AND_BUILD_TIME
    value: admin
  - key: ADMIN_PASSWORD
    scope: RUN_TIME
    value: admin123
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
