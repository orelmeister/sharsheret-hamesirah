version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://sharsheret:sharsheret@db:5432/sharsheret
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sharsheret
      POSTGRES_PASSWORD: sharsheret
      POSTGRES_DB: sharsheret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sharsheret']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
